<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Bison — metered, multi-tenant GPU for Kubernetes">
  <defs>
    <linearGradient id="hl-name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071E3"/>
      <stop offset="0.55" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#10A37F"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>

  <!-- mark: GPU chip metered by a balance gauge -->
  <g transform="translate(100 150)">
    <!-- gauge ring -->
    <circle cx="0" cy="0" r="62" fill="url(#hl-name)" fill-opacity="0.07" stroke="url(#hl-name)" stroke-width="3"/>
    <!-- gauge ticks: healthy / warning / suspended -->
    <line x1="44" y1="-44" x2="36" y2="-36" stroke="#10A37F" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-62" x2="0" y2="-50" stroke="#C77800" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-44" y1="-44" x2="-36" y2="-36" stroke="#E0492F" stroke-width="3.5" stroke-linecap="round"/>
    <!-- GPU chip -->
    <rect x="-26" y="-24" width="52" height="48" rx="11" fill="#5E5CE6" fill-opacity="0.14" stroke="#5E5CE6" stroke-width="2.2"/>
    <rect x="-13" y="-12" width="26" height="24" rx="5" fill="#5E5CE6" fill-opacity="0.22" stroke="#5E5CE6" stroke-width="1.4"/>
    <g stroke="#5E5CE6" stroke-width="2.2" stroke-linecap="round">
      <line x1="-12" y1="-24" x2="-12" y2="-32"/><line x1="0" y1="-24" x2="0" y2="-32"/><line x1="12" y1="-24" x2="12" y2="-32"/>
      <line x1="-12" y1="24" x2="-12" y2="32"/><line x1="0" y1="24" x2="0" y2="32"/><line x1="12" y1="24" x2="12" y2="32"/>
      <line x1="-26" y1="-10" x2="-34" y2="-10"/><line x1="-26" y1="0" x2="-34" y2="0"/><line x1="-26" y1="10" x2="-34" y2="10"/>
      <line x1="26" y1="-10" x2="34" y2="-10"/><line x1="26" y1="0" x2="34" y2="0"/><line x1="26" y1="10" x2="34" y2="10"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="200" y="128" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#hl-name)">Bison</text>

  <!-- tagline -->
  <text x="202" y="170" font-size="24" font-weight="600" fill="#1D1D1F">Metered, multi-tenant GPU for Kubernetes</text>
  <text x="202" y="200" font-size="17" font-weight="500" fill="#6E6E73">prepaid balances · usage-based billing · per-team isolation</text>

  <!-- balance-state chips -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="202" y="224" width="92" height="28" rx="14" fill="#10A37F" fill-opacity="0.12" stroke="#10A37F" stroke-width="1.3"/>
    <text x="248" y="243" fill="#0B6B53">Healthy</text>
    <rect x="302" y="224" width="92" height="28" rx="14" fill="#C77800" fill-opacity="0.12" stroke="#C77800" stroke-width="1.3"/>
    <text x="348" y="243" fill="#9A5B00">Warning</text>
    <rect x="402" y="224" width="110" height="28" rx="14" fill="#E0492F" fill-opacity="0.12" stroke="#E0492F" stroke-width="1.3"/>
    <text x="457" y="243" fill="#B5301B">Suspended</text>
    <text x="524" y="243" font-size="13" font-weight="500" text-anchor="start" fill="#6E6E73">balance-driven</text>
  </g>
</svg>
