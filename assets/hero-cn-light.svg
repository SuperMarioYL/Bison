    <text x="235" y="243" fill="#0B6B53">健康</text>
    <rect x="278" y="224" width="66" height="28" rx="14" fill="#C77800" fill-opacity="0.12" stroke="#C77800" stroke-width="1.3"/>
    <text x="311" y="243" fill="#9A5B00">预警</text>
    <rect x="354" y="224" width="66" height="28" rx="14" fill="#E0492F" fill-opacity="0.12" stroke="#E0492F" stroke-width="1.3"/>
    <text x="387" y="243" fill="#B5301B">停用</text>
    <text x="434" y="243" font-size="13" font-weight="500" text-anchor="start" fill="#6E6E73">余额驱动</text>
