<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：用户 → Bison 控制面 → 核心服务 → Capsule / OpenCost / Prometheus / ConfigMap，配每小时计费调度器">
  <defs>
    <marker id="acd-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <text x="40" y="34" font-size="14" font-weight="700" fill="#F5F5F7">Bison · Go API + React UI · 全部状态存于 Kubernetes ConfigMap · 零外部数据库</text>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="208" y1="85" x2="256" y2="85" marker-end="url(#acd-d)"/>
    <line x1="391" y1="112" x2="391" y2="148" marker-end="url(#acd-d)"/>
    <line x1="707" y1="112" x2="707" y2="140"/>
    <line x1="707" y1="140" x2="566" y2="140"/>
    <line x1="566" y1="140" x2="566" y2="148" marker-end="url(#acd-d)"/>
    <line x1="184" y1="238" x2="146" y2="268" marker-end="url(#acd-d)"/>
    <line x1="436" y1="238" x2="352" y2="268" marker-end="url(#acd-d)"/>
    <line x1="560" y1="238" x2="700" y2="268" marker-end="url(#acd-d)"/>
    <line x1="452" y1="299" x2="440" y2="299" marker-end="url(#acd-d)"/>
  </g>

  <g>
    <rect x="40" y="58" width="168" height="54" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="124" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#4DA3FF">用户</text>
    <text x="124" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">管理员 · 负责人 · 开发者</text>
  </g>
  <g>
    <rect x="262" y="58" width="258" height="54" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="391" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#4DA3FF">Bison 控制面</text>
    <text x="391" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">Web UI (React) · REST API (Go / Gin)</text>
  </g>
  <g>
    <rect x="574" y="58" width="266" height="54" rx="14" fill="#E0A33A" fill-opacity="0.16" stroke="#E0A33A" stroke-width="1.5"/>
    <text x="707" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#E0A33A">调度器</text>
    <text x="707" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">每小时：计量 → 扣费 → 预警 / 停用</text>
  </g>

  <g>
    <rect x="110" y="150" width="520" height="88" rx="16" fill="#8985FF" fill-opacity="0.12" stroke="#8985FF" stroke-width="1.5"/>
    <text x="370" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#8985FF">核心服务</text>
    <g font-size="12" font-weight="600">
      <rect x="126" y="186" width="116" height="40" rx="11" fill="#8985FF" fill-opacity="0.18" stroke="#8985FF" stroke-width="1.3"/>
      <text x="184" y="204" text-anchor="middle" fill="#8985FF">租户</text>
      <text x="184" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">团队</text>

      <rect x="252" y="186" width="116" height="40" rx="11" fill="#8985FF" fill-opacity="0.18" stroke="#8985FF" stroke-width="1.3"/>
      <text x="310" y="204" text-anchor="middle" fill="#8985FF">配额</text>
      <text x="310" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">CPU · GPU · 内存</text>

      <rect x="378" y="186" width="116" height="40" rx="11" fill="#8985FF" fill-opacity="0.18" stroke="#8985FF" stroke-width="1.3"/>
      <text x="436" y="204" text-anchor="middle" fill="#8985FF">计费</text>
      <text x="436" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">单价 × 用量</text>

      <rect x="504" y="186" width="116" height="40" rx="11" fill="#8985FF" fill-opacity="0.18" stroke="#8985FF" stroke-width="1.3"/>
      <text x="562" y="204" text-anchor="middle" fill="#8985FF">余额</text>
      <text x="562" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">钱包 · 停用</text>
    </g>
  </g>

  <g>
    <rect x="40" y="270" width="200" height="58" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5"/>
    <text x="140" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#8985FF">Capsule</text>
    <text x="140" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">Tenant = 团队 · NS = 项目</text>

    <rect x="256" y="270" width="180" height="58" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="346" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#2DC79A">OpenCost</text>
    <text x="346" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">/allocation · 按 ns 成本</text>

    <rect x="452" y="270" width="150" height="58" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="527" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#2DC79A">Prometheus</text>
    <text x="527" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">指标</text>

    <rect x="618" y="270" width="222" height="58" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="729" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#4DA3FF">ConfigMap (etcd)</text>
    <text x="729" y="312" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">余额 · 计费配置 · 零数据库</text>
  </g>
</svg>
