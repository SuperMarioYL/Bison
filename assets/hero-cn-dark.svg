  <text x="200" y="128" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#hcd-name)">Bison</text>

  <text x="202" y="170" font-size="24" font-weight="600" fill="#F5F5F7">Kubernetes 上的多租户 GPU 计费平台</text>
