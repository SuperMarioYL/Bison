    <line x1="44" y1="-44" x2="36" y2="-36" stroke="#2DC79A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-62" x2="0" y2="-50" stroke="#E0A33A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-44" y1="-44" x2="-36" y2="-36" stroke="#FF6B52" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-26" y="-24" width="52" height="48" rx="11" fill="#8985FF" fill-opacity="0.18" stroke="#8985FF" stroke-width="2.2"/>
    <rect x="-13" y="-12" width="26" height="24" rx="5" fill="#8985FF" fill-opacity="0.28" stroke="#8985FF" stroke-width="1.4"/>
    <g stroke="#8985FF" stroke-width="2.2" stroke-linecap="round">
      <line x1="-12" y1="-24" x2="-12" y2="-32"/><line x1="0" y1="-24" x2="0" y2="-32"/><line x1="12" y1="-24" x2="12" y2="-32"/>
      <line x1="-12" y1="24" x2="-12" y2="32"/><line x1="0" y1="24" x2="0" y2="32"/><line x1="12" y1="24" x2="12" y2="32"/>
      <line x1="-26" y1="-10" x2="-34" y2="-10"/><line x1="-26" y1="0" x2="-34" y2="0"/><line x1="-26" y1="10" x2="-34" y2="10"/>
      <line x1="26" y1="-10" x2="34" y2="-10"/><line x1="26" y1="0" x2="34" y2="0"/><line x1="26" y1="10" x2="34" y2="10"/>
